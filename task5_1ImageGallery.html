<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TableGallery</title>
    <style>
        h1{
            background-color: rgb(250, 112, 112);
        }
        table{
            background-color: aquamarine;
        }
        td{
            background-color: rgb(39, 122, 105);
        }
        tr{
            background-color: rgb(154, 46, 132);
        }
    </style>
</head>
<body>
    <h1 align="center">Image Gallery Using Tables and Nested Tables</h1>
    <table border="1" align="center" cellpadding="5" cellspacing="15">
        <tr>
            <th>Mountain Gallery</th>
            <th>Forest Gallery</th><br/>
        </tr>   
        <tr>   
            <td ><img src="assets/mountain view.jpeg" height="300" width="400"/></td>
            
            <td><img src="assets/green forest.jpeg" height="300" width="400"/></td>
            
        </tr>
        <tr>
            <td>Mountain View</td>
            <td>Green Forest</td>
        </tr>
        <tr>
           <td><img src="assets/snowy peaks.jpeg" height="300" width="400"/></td>
            <td><img src="assets/forest path.jpeg" height="300" width="400"/></td> 
        </tr>
        <tr>
            <td>Snowy Peaks</td>
            <td>Forest Path</td>
        </tr>
        <tr>
            <th>Beach Gallery</th>
            <th>City Gallery</th>
        </tr>
        <tr>   
            <td ><img src="assets/sunny beach.jpeg" height="300" width="400"/></td>
            
            <td><img src="assets/city street.jpeg" height="300" width="400"/></td>
            
        </tr>
        <tr>
            <td>Sunny Beach</td>
            <td>City Street</td>
        </tr>
        <tr>   
            <td ><img src="assets/ocean waves.jpeg" height="300" width="400"/></td>
            
            <td><img src="assets/night skyline.jpeg" height="300" width="400"/></td>
            
        </tr>
        <tr>
            <td>Ocean Waves</td>
            <td>Night Skyline</td>
        </tr>
        <tr>
            <th>Wildlife Gallery</th>
            <th>lake Gallery</th>
        </tr>
        <tr>   
            <td ><img src="assets/fox.jpeg" height="300" width="400"/></td>
            
            <td><img src="assets/beautiful lake.jpeg" height="300" width="400"/></td>
            
        </tr>
        <tr>
            <td>Fox</td>
            <td>Beautiful lake</td>
        </tr>
        
    </table>
</body>
</html>
